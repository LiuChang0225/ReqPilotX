- insert:
    - id: reqpilotx-host
      name: '@reqpilotx/dsh-pair-host'
      config:
        mode: !!js process.env.REQPILOT_SERVICE_ORIGIN ? 'connect' : 'managed'
        serviceOrigin: !!js process.env.REQPILOT_SERVICE_ORIGIN
        dataRoot: !!js process.env.REQPILOT_PAIR_DATA_ROOT
        python: !!js process.env.REQPILOT_PAIR_PYTHON
        frontendRoot: !!js process.env.REQPILOT_PAIR_FRONTEND_ROOT
        taskMcp: true
        capabilityRoot: !!js process.env.REQPILOT_PAIR_CAPABILITY_ROOT
        agentPreset: !!js process.env.REQPILOT_PAIR_AGENT_PRESET || 'standard'
        # New tasks use the selected PAIR default model/effort. Set agentModel
        # only as an explicit deployment override; the exact selection is frozen
        # in the launch receipt before dispatch.
    - id: reqpilotx-client
      name: '@reqpilotx/dsh-pair-client'
