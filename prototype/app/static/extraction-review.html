<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发者- PDF 拆解审阅台</title>
    <link rel="stylesheet" href="/assets/extraction-review.css?v=20260325-1" />
  </head>
  <body>
    <main class="review-page">
      <header class="hero">
        <div>
          <h1>PDF 拆解审阅台</h1>
          <p>内部开发者工具：逐份核查章节拆解完整性与解析层质量指标（多引擎对比）。</p>
        </div>
        <nav class="hero-nav">
          <a href="/home">项目首页</a>
          <a href="/workspace">主控台</a>
          <a href="/phase0-review">Phase0 标注台</a>
        </nav>
      </header>

      <section class="panel controls">
        <label>
          项目
          <select id="project-select"></select>
        </label>
        <label>
          SOR 文档
          <select id="document-select"></select>
        </label>
        <div class="actions">
          <button id="refresh-btn" type="button">刷新列表</button>
          <button id="load-btn" type="button">加载完整拆解结果</button>
        </div>
      </section>

      <section class="panel summary">
        <h2>拆解总览</h2>
        <div id="summary-cards" class="cards"></div>
        <p id="status-line" class="status"></p>
      </section>

      <details class="panel diagnostics-collapse">
        <summary>开发诊断详情（默认折叠）</summary>
        <div class="diagnostics-grid">
          <section class="diag-block">
            <h3>解析引擎分布</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>引擎</th>
                    <th>被选页数</th>
                  </tr>
                </thead>
                <tbody id="engine-body"></tbody>
              </table>
            </div>
          </section>

          <section class="diag-block">
            <h3>章节总览（层级 + 覆盖）</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>附录域</th>
                    <th>章节号</th>
                    <th>标题</th>
                    <th>层级</th>
                    <th>父章节</th>
                    <th>页范围</th>
                    <th>需求条数</th>
                    <th>字符数</th>
                    <th>需求候选</th>
                  </tr>
                </thead>
                <tbody id="section-overview-body"></tbody>
              </table>
            </div>
          </section>

          <section class="diag-block">
            <h3>章节一致性检查（缺号 / 重号 / 异常层级）</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>问题类型</th>
                    <th>严重度</th>
                    <th>附录域</th>
                    <th>章节号</th>
                    <th>详情</th>
                  </tr>
                </thead>
                <tbody id="consistency-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </details>

      <section class="panel requirements">
        <h2>完整需求条目</h2>
        <div class="requirements-layout">
          <div class="requirements-main">
            <div class="filters">
              <label>
                分类
                <div id="type-filter-group" class="type-filter-group"></div>
              </label>
              <label>
                章节
                <input id="section-filter" placeholder="例如 5.3.6.2 或 A:1.2.3" />
              </label>
              <label>
                关键词
                <input id="keyword-filter" placeholder="关键词过滤 requirement_text" />
              </label>
            </div>
            <div class="actions mini-actions">
              <button id="select-all-btn" type="button">全部保留</button>
              <button id="unselect-all-btn" type="button">全部移除</button>
              <button id="toggle-selected-btn" type="button">仅看保留</button>
              <button id="toggle-source-recommended-btn" type="button">仅看推荐截图</button>
              <button id="apply-reviewed-btn" type="button">应用到主控台矩阵</button>
              <button id="lock-reviewed-btn" type="button">锁定条目集</button>
              <span id="selection-status" class="selection-status"></span>
              <label class="inline-toggle">
                <input id="raw-rows-toggle" type="checkbox" />
                显示原始重复项
              </label>
            </div>
            <div class="table-wrap">
              <table class="requirements-table">
                <colgroup>
                  <col class="col-keep" />
                  <col class="col-kind" />
                  <col class="col-scope" />
                  <col class="col-section" />
                  <col class="col-text" />
                  <col class="col-page" />
                </colgroup>
                <thead>
                  <tr>
                    <th>保留</th>
                    <th>分类</th>
                    <th>附录域</th>
                    <th>章节</th>
                    <th>需求文本</th>
                    <th>页范围</th>
                  </tr>
                </thead>
                <tbody id="requirement-body"></tbody>
              </table>
            </div>
          </div>
          <aside class="pdf-compare">
            <button
              id="pdf-drawer-toggle"
              class="pdf-drawer-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="pdf-viewer-frame"
            >
              展开对照
            </button>
            <div class="pdf-compare-head">
              <h3>原 PDF 对照</h3>
              <button id="open-pdf-btn" type="button">新窗口打开</button>
            </div>
            <p id="pdf-hint" class="pdf-hint">点击左侧条目后，这里会跳转到对应页。</p>
            <iframe
              id="pdf-viewer-frame"
              class="pdf-viewer-frame"
              title="原PDF对照"
              loading="lazy"
            ></iframe>
          </aside>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/extraction-review.js?v=20260325-1"></script>
  </body>
</html>
