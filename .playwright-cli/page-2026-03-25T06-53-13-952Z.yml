            - row "REQUIREMENT 3.2.2 产品详细描述 4）外观要求 —阳极氧化外观要求（若无阳极氧化可忽略）： 1、外观磕伤、划伤标准： 可视区域：磕伤、划伤不露底数量小于等于10条； （划伤标准：长30mm*宽2mm以内可以放行， 磕伤标准：长10mm*宽3mm以内可以放行） 2、因打磨飞边导致的阳极氧化后色差不作为管控项（阳极氧化前打磨导致）。 3、机加面：不允许有鼓包开裂、缩松、气孔、黑皮、铝屑残留、裂纹、折叠、腐蚀、切伤。机加面痕迹不允许触摸分层感、 毛刺高度不允许超过0.5mm。 4、此外观标准中只要求不可接受的项目，对其状态进行定义及量化，未提及到的项目均默认为合格。 —表面处理方式：零件中各个铸铝壳体外观颜色应保持一致，整体为暗黑色，优先建采用钝化工艺。 —产品表面应清洁、无锈蚀、毛刺、裂纹和其它缺陷，表面应均匀一致； —产品标识、标记清晰、规范、字迹清楚，符合产品图要求； —产品涂漆层应均匀，色标明显、无碰伤、划伤等缺陷； —镀锌件电镀层均匀、不允许有针孔、缺镀、裂纹、凹陷、麻点及碰伤、划伤、锈蚀等明显缺陷；镀层厚度满足产 品图样要求； —期望按此执行，偏差过程中由供应商提出双方确认，确保实施可量产，易操作。 —橡胶或塑料件成型完整，无破口，无划伤，其表面无裂纹、变形、波纹、烧焦、飞边、毛刺、气泡、浇口痕迹、 顶杆印痕、熔接痕和收缩痕等其他缺陷； —紧固件连接应牢固，引出线或接线端应完整无损，颜色和标识应正确，铭牌的字迹和内容应清晰无误，且不应脱 落, 接插件无退针现象; —与对手件连接的螺纹不能有损伤。 —管路无折痕迹、破损、划伤、毛边、异物，锁油阀接口防尘套无松脱、防尘套内无油滴； —硬管无变形，涂层完好，无焊接缺陷； 4-5" [ref=e433]:
