<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReqPilotX PDF Viewer</title>
    <link rel="icon" href="/assets/reqpilotx-logo.svg" type="image/svg+xml" />
    <script>
      (function() {
        const theme = localStorage.getItem('reqx-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="/assets/reqpilotx-brand.css?v=20260403-reqx2" />
    <link rel="stylesheet" href="/assets/pdf-viewer.css?v=20260403-brandfix2" />
  </head>
  <body>
    <main class="pdf-viewer-page">
      <header class="toolbar">
        <div class="reqx-toolbar-brand">
          <img src="/assets/schaeffler-logo.svg" alt="Schaeffler" class="reqx-brand-logo is-compact" />
          <div class="reqx-brand-copy">
            <span class="reqx-brand-name">ReqPilotX</span>
            <span class="reqx-brand-caption">PDF Viewer</span>
          </div>
          <div class="meta">
            <span id="status-text">加载中...</span>
            <span id="page-text">- / -</span>
          </div>
        </div>
        <div class="actions">
          <button id="prev-page" type="button" aria-label="上一页">‹</button>
          <button id="next-page" type="button" aria-label="下一页">›</button>
          <button id="zoom-out" type="button">-</button>
          <button id="zoom-in" type="button">+</button>
        </div>
      </header>

      <section id="error-box" class="error-box hidden" aria-live="assertive">
        <p id="error-text">PDF 加载失败。</p>
        <a id="open-link" href="#" target="_blank" rel="noopener noreferrer">新窗口打开原文</a>
      </section>

      <section id="canvas-wrap" class="canvas-wrap">
        <div id="canvas-container" style="position: relative; display: inline-block;">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </section>
    </main>

    <script src="/assets/vendor/pdfjs/pdf.min.js"></script>
    <script type="module" src="/assets/pdf-viewer.js?v=20260403-reqx1"></script>
  </body>
</html>
