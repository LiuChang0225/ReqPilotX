              - cell [ref=e1772]:
                - generic:
                  - text: 1.1 环境适应性要求（必备）
                  - text: 前油泵部件安装在前副车架的前转和电池包之间位置，需满足工作温度-40℃～105℃，存储温度-40℃～105℃；后油泵安装在后轮转向和尾消之间，需满足工作温度-40℃～105℃，
                  - text: 存储温度-40℃～105℃；在5%RH～95%的湿度范围内应能正常工作，支持在55kPa（等效4800m海拔）低气压环境下正常工作（可降额工作）。
                  - text: 低压电器件防护等级要求（湿区）：
                  - text: （1）离地高度≤VTS最高涉水深度+200mm，要求≥IP67;
                  - text: （2）离地高度＞VTS最高涉水深度+200mm，要求≥IP66；
                  - text: （3）离地高度＞VTS最高涉水深度+200mm（侧门内腔），要求≥IP64；
                  - text: （4）离地高度＞VTS最高涉水深度+200mm（高压水直喷），要求＝IP69K；
                  - text: （5）各电器与之配合的接插件需要达到相同的防护等级要求；
                  - text: 低压电器件防护等级要求（干区）：
                  - text: （1）侧门扶手区域、门槛分缝区域，要求≥IP54；
                  - text: （2）玻璃贴膜过程中水滴覆盖区域，要求≥IP53；
                  - text: （3）车内意外水泼洒工况水流覆盖区域，要求≥IP54;
                  - text: （4）尾门内腔，冷凝水滴落区域，要求≥IP52；
                  - text: （5）安全系统相关电器及接插件（ACU/气囊/安全带等）均需满足防护等级≥IP67；
                  - text: （6）各电器件与之配合的接插件需要达到相同的防护等级要求（安全系统除外）；
                  - text: 高压部件防护等级要求；
                  - text: 所有高压部件均需满足防护等级要求≥IP67&IPX9K；
                  - text: 涉水要求：
                  - text: 各零部件在整车涉水后，不能出现渗水或者漏水，不能出现功能降低或失效，整车性能不能出现下降，不能出现零件变形、破损及脱落等问题；
                  - text: 150mm涉水，车速：30+3km/h；时长：20min；方向：前进；
                  - text: 200mm涉水，车速：20±2km/h；时长：20min；方向：前进；
                  - text: 300mm涉水，车速：8±3km/h；时长：10min；方向：前进+倒退；
                  - text: 400mm涉水，车速：5~8km/h；时长：10min；方向：前进+倒退；
                  - text: 500mm涉水，车速：5±3km/h；时长：10min；方向：前进+倒退
                  - text: 冰冻要求：
                  - text: 零部件在整车安装姿态下，100bar水压冲洗5个循环后，进入-30℃低温舱8小时，冰冻后零部件无功能损失及性能下降；
                  - text: 对应的验证需求需满足GB/T 28046.4 《道路车辆电气及电子设备的环境条件和试验第4部分：气候负荷》的要求，包括但不限于：低温存储、低温工作、高温存储、高温工作、温度
                  - text: 梯度、温度循环、温度冲击、交变湿热、防尘防水等要求。
