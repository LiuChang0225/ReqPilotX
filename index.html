<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./snake/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Snake</h1>
      <div class="hud">
        <p>Score: <span data-score>0</span></p>
        <p data-status>Running</p>
      </div>

      <div class="board" data-board aria-label="Snake game board"></div>

      <div class="actions">
        <button type="button" data-restart>Restart</button>
        <button type="button" data-pause>Pause</button>
      </div>

      <div class="controls" aria-label="Direction controls">
        <button type="button" data-control="up" aria-label="Move up">Up</button>
        <button type="button" data-control="left" aria-label="Move left">Left</button>
        <button type="button" data-control="down" aria-label="Move down">Down</button>
        <button type="button" data-control="right" aria-label="Move right">Right</button>
      </div>
    </main>

    <script type="module" src="./snake/app.mjs"></script>
  </body>
</html>
