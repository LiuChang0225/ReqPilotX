name: Python isolated tests

on:
  push:
  pull_request:

permissions:
  contents: read
concurrency:
  group: python-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: prototype/requirements-test-linux-py313.lock
      - name: Install local OCR binary and OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0
      - name: Install locked Python dependencies
        run: |
          uv venv --python python3.13 prototype/.venv
          uv pip sync --python prototype/.venv/bin/python prototype/requirements-test-linux-py313.lock
          uv pip check --python prototype/.venv/bin/python
      - name: Build frontend consumed by API composition tests
        run: |
          npm ci
          npm run build
      - name: Backend isolated tests
        run: prototype/.venv/bin/python scripts/test_python.py backend
      - name: Portable plugin and real MCP stdio tests
        run: prototype/.venv/bin/python scripts/test_python.py plugin
      - name: Installable engine release and wheel-derived plugin
        run: prototype/.venv/bin/python scripts/verify_engine_release.py --repo .
      - name: Disposable PostgreSQL and HTTP workbench recovery
        run: |
          sudo apt-get install -y postgresql
          prototype/.venv/bin/python scripts/smoke_workbench.py --postgres-bin "$(pg_config --bindir)" --output output/ci-smoke
      - name: Relocated Pair with non-editable installed engine and server
        run: |
          prototype/.venv/bin/python plugins/reqpilot/scripts/build_engine.py --repo . --output output/r4-engine
          uv build --wheel --no-build-logs --out-dir output/r4-server apps/server
          uv venv --python python3.13 "$RUNNER_TEMP/r4-installed"
          uv pip install --python "$RUNNER_TEMP/r4-installed/bin/python" output/r4-engine/*.whl output/r4-server/*.whl
          prototype/.venv/bin/python plugins/reqpilot/scripts/reqpilot.py --project-root . worked-example --output-dir output/r4-synthetic
          cp -R integrations/pair "$RUNNER_TEMP/r4-pair"
          cp -R apps/web/dist "$RUNNER_TEMP/r4-web"
          node "$RUNNER_TEMP/r4-pair/scripts/installed-smoke.mjs" "$RUNNER_TEMP/r4-installed/bin/python" "$RUNNER_TEMP/r4-web" "$(pg_config --bindir)" "$PWD/output/r4-synthetic" "$PWD/output/r4-installed-receipt.json"
