            - row "REQUIREMENT 4.2 智能部件（带有操作系统和文件系统的部件）通用要求 4.2 智能部件（带有操作系统和文件系统的部件）通用要求： （1）对于各域控部件，应能够集成OTA车端相关SDK； （2）需接收并处理OTA模式信号，遵循《OTA解决方案设计规范》进行相关业务处理； （3）支持在整车高压上电状态下进行刷写； （4）支持断点续传； （5）对于下载软件包大于300M的控制器，支持差分还原； （6）支持A/B双分区，分区的方案和激活要求，应提前与JAC进行充分对接，在激活新分区失败时，应回到到原可用分区，也需支持按 installer 切区指令进行回滚操作； （7）应满足刷写成功率99.9%，置信度95%要求（3000次0失败/4750次失败1次），并自行提供测试报告，测试报告格式需得到JAC认可； （8）擦除刷写次数应不低于5000次； （9）刷写时长要求应软件包大小分类，遵循《OTA开发技术要求》的刷写时长要求； （10）软件打包格式必需按照《零部件软件打包与资产信息采集规范 》开发相关DID信息，并按该规范进行打包命名； （11）未提及的，均遵循《OTA开发技术要求》《OTA解决方案设计规范》的内容及要求，进行设计开发。 16-16" [ref=e2047]:
