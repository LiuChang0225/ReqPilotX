            - row "REQUIREMENT 7.2 环境适应性要求 7.2）环境适应性要求 —油泵总成工作环境温度：-40℃~120℃；总成在温度梯度、温度循环、温度冲击测试中与测试后，均能正常工作，密封正常，无异常噪声。 满足整车寿命10年24万公里，行驶时间6000h，部件可靠度R99C50要求，测试样本量6个。 —油泵总成在稳态湿热、交变湿热以及冰水浸没测试中与测试后均能正常工作，密封正常，无异常噪声。 —油泵总成要求密封等级IP68 & IP6K9K，连接器插合后，面板安装面、连接器插合面及线缆连接处达到IP68 & IP6K9K防护等级。在高 压喷射清洗 IPX9K 测试后能正常工作，密封正常，试验后润滑油含水量无明显变化。 —涉水要求： 各零部件在整车涉水后，不能出现渗水或者漏水，不能出现功能降低或失效，整车性能不能出现下降，不能出现零件变形、破损及脱落等问题； —冰冻要求： 零部件在整车安装姿态下，100bar水压冲洗5个循环后，进入-30℃低温舱8小时，冰冻后零部件无功能损失及性能下降。 —油泵总成在400h盐雾腐蚀测试后能正常工作，表面无红锈，密封正常，试验后润滑油含水量无明显变化。 7-7" [ref=e731]:
