name: Source and frontend verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-and-frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check distributable tree
        run: python prototype/scripts/repository_safety_audit.py --staged
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test
      - run: node --test packages/workbench-ui/scripts/scope-panel-css.test.mjs
      - run: npm run build
      - run: npm run build:panel
      - run: node integrations/pair/scripts/build.mjs
      - run: npm --prefix integrations/pair/tests/react-host ci --ignore-scripts
      - name: Pair independent adapter contracts
        run: PAIR_REACT_ROOT="$PWD/integrations/pair/tests/react-host" node --test integrations/pair/tests/*.test.mjs
