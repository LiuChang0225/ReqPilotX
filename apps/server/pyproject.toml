[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reqpilotx-server"
version = "0.1.0"
description = "ReqPilotX API, worker, persistence, object storage and Agent host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "reqpilotx-engine",
  "fastapi==0.116.1",
  "pydantic==2.13.4",
  "starlette==0.47.3",
  "gunicorn==23.0.0",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
  "jsonschema==4.26.0",
  "pypdf==5.9.0",
  "pdfplumber==0.11.7",
  "pymupdf==1.27.1",
  "pymupdf4llm==0.3.4",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "xlsxwriter==3.2.9",
  "Pillow==11.3.0",
  "openai==2.30.0",
  "azure-identity==1.25.3",
  "azure-search-documents==11.6.0",
  "truststore==0.10.4",
  "psycopg[binary,pool]==3.3.4",
]

[project.optional-dependencies]
retrieval = [
  "qdrant-client==1.15.1",
  "haystack-ai==2.26.1",
  "azure-ai-search-haystack==3.1.0",
  "sentence-transformers==3.4.1",
]
oss = ["alibabacloud-oss-v2==1.3.2"]

[project.scripts]
reqpilotx-api = "reqpilotx_server.cli:api_main"
reqpilotx-worker = "reqpilotx_server.worker.__main__:main"
reqpilotx-capability = "reqpilotx_server.tools.prepare_native_loop_capability:main"
reqpilotx-saas-invite = "reqpilotx_server.saas.invite:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reqpilotx_server*"]
namespaces = true

[tool.setuptools.package-data]
reqpilotx_server = [
  "adapters/agents/codex_app_server/protocol_lock.json",
  "resources/migrations/postgresql/*.sql",
]
