<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ReqPilotX 将 SOR 文档、结构整理、工程审阅、AI 证据与 Compliance Matrix 串成一条可追溯工作流。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300a651'/%3E%3Cpath d='M8 9h7.1c4 0 6.3 2 6.3 5.2 0 2.1-1 3.7-2.9 4.6l5.1 4.2h-4.9l-4.2-3.6H12V23H8V9Zm4 3.4V16h3c1.5 0 2.3-.6 2.3-1.8 0-1.2-.8-1.8-2.3-1.8h-3Z' fill='white'/%3E%3C/svg%3E"
    />
    <title>ReqPilotX</title>
    <script>
      (() => {
        const theme = localStorage.getItem("reqx-theme") || "light";
        const stored = localStorage.getItem("reqx-language");
        const language = stored || (navigator.language.toLowerCase().startsWith("en") ? "en-US" : "zh-CN");
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
