            - row "REQUIREMENT 3.2 智能诊断设计要求 3.2 智能诊断设计要求 （1）传统ECU（基于MCU嵌入式芯片开发，没有智能操作系统和文件系统）要求： a.支持通过CAN/CANFD通过定周期的报文方式循环发送，携带当前故障总数、帧序号、供应商代码、故障内部编号等信息，支持故障码并发和循环发送，设计需遵循《故障监控规范》要求； b.上报故障码范围必须与诊断问卷版本一致，故障内部编号不得重复，需要能够向下进行版本兼容，平台化沿用件需尽量保证编号的一致性。 d.在下电前故障仍然存在，需支持记忆，并在下次上电需要继续发出对应故障编码，不允许从全0开始发送 c.原则上所有CAN/CANFD部件都需要支持故障上报，有特殊原因不支持的需要进行额外申明 d.未提及的，均遵循《智能诊断技术要求》的内容及要求，进行设计开发。 （2）域控（带有智能操作系统和文件系统）要求： a.支持将自身DTC上报给整车故障监测模块 b.实现自身维测日志主动上云，响应车端控制中心的日志远程调取指令，并打包日志上传云端，响应车端控制中心的功能开发指令，并使能。 c.支持下挂件精确追溯信息采集，并响应车端控制中心指令进行响应 e.未提及的，均遵循《智能诊断技术要求》的内容及要求，进行设计开发。 15-15" [ref=e1999]:
