            - row "REQUIREMENT 3.1 诊断设计要求 3.1 诊断设计要求 诊断开发设计需遵循UDS诊断相关规范要求： （1）部件诊断服务应遵循《UDS诊断规范》要求； （2）支持LIN、CAN/CANFD、DOIP诊断方式的ECU的开发，应分别遵循《LIN规范》、《CANCANFD规范》、《DOIP规范》要求； （3）具备诊断信息路由功能的部件的开发,需遵循《诊断路由规范》要求； （4）诊断网关与外部诊断设备的认证机制，需遵循《接入认证设计规范》要求； （5）安全认证过程中的加密运算算法采用AES-CMAC，安全访问认证流程、算法要求、安全等级划分、密钥管理等开发及定义需遵循《27服务认证设计规范》要求； （6）支持重编程的ECU，应支持带地址长度的一次性擦除，也应支持多次的分段擦除，重编程要求和过程说明、安全签名需遵循《刷写规范》要求；升级及打包要求应遵循、《零部件软件打包与资 产信息采集规范 》、《升级版本包打包工具使用说明书》执行； （7）支持重编程的ECU，应优先选择非对称签名ED25519、ECC256进行安全签名，签名方案及要求需遵循《软件刷写签名算法规范》； （8）支持诊断的ECU,诊断故障码（DTC）相关要求，包括故障检测相关要求、DTC相关的格式需遵循《诊断故障码规范》； （9）部件带执行器，需支持0x2F服务。例如：水泵、开关、大灯等 15-15" [ref=e1789]:
