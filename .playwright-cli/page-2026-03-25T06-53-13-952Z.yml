              - cell "4.1 传统ECU（基于MCU嵌入式芯片开发，没有智能操作系统和文件系统，不支持自安装）要求： （1）为满足OTA相关验签算法、刷写处理时间等要求，芯片选型对RAM和ROM有最低要求：RAM:4K及以上；ROM:32K及以上；并提交《OTA技术要求调查表》； （2）软件打包格式必需按照《零部件软件打包与资产信息采集规范 》开发相关DID信息，并按《升级版本包打包工具使用说明书》进行打包，并依此格式进行软件包提供给JAC； （3）主控节点、动力相关核心部件，驾驶相关核心部件，需支持A/B双分区，且建议优先采用硬件A/B分区方案非软件双分区方案，以确保最小人驾功能。其他部件，建议支持 A/B 双分区；且对于 支持双分区部件需参考《刷写规范》的双分区刷写流程进行刷写流程开发； （4）双分区ECU，必须严格遵守installer的指令再进行切区、回滚；并在刷写失败的异常重启中能在可用分区启动； （5）单分区ECU，应支持重刷写且任意情况下均支持11 01复位，刷写失败后应能停留在BOOT，并能响应UDS指令支持重刷写； （6）应能在启动时判断APP有效性，并在APP无效时停留在BOOT中，并能响应UDS指令支持重刷写； （7）应满足刷写成功率99.9%，置信度95%要求（3000次0失败/4750次失败1次），并依据JAC提供的测试用例或测试工具和相关模板进行测试并提供测试报告； （8）刷写时长要求应按通信类型和软件包大小分类，遵循《OTA开发技术要求》的刷写时长要求； （9）应提前进行硬件版本和BOOT版本规划，在硬膜装车后原则上不允许更改BOOT版本，如硬件或BOOT版本更改，原则上后续APP版本应支持硬膜装车后的所有BOOT和硬件版本； （10）各CAN/CANFD部件均需接收并处理OTA模式信号，遵循《OTA开发技术要求》进行相关业务处理； （11）支持在整车高压上电状态下进行刷写，对于与高压耦合的部件，需处理OTA模式，并进行双分区设计处理，如不能支持需单独提出； （12）未提及的，均遵循《OTA开发技术要求》的内容及要求，进行设计开发。":
